[package]
name = "digital-qc"
version = "0.1.0"
description = "Digital QC desktop application"
authors = ["Meiko"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[lib]
name = "digital_qc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
